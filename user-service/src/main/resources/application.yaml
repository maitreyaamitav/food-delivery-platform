spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.default_schema: food_delivery
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8081
  servlet: 
    context-path: /food-delivery-app